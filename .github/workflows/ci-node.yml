name: Backend & Web Node CI

on:
  push:
    paths:
      - 'backend/**'
      - 'web/**'
      - 'packages/**'
      - '.github/workflows/ci-node.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'web/**'
      - 'packages/**'

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'backend/pnpm-lock.yaml'

      - name: Build and Test Backend
        run: |
          cd backend
          pnpm install
          pnpm run build
          pnpm test

      - name: Build Web Dashboard
        run: |
          cd web
          pnpm install
          pnpm run build
