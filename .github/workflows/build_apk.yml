name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK (ARM64 / ARMv7)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build Core Native Library (C++ / NDK)
        run: |
          mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p mobile/android/app/src/main/jniLibs/armeabi-v7a
          cmake -B build/android_arm64 -S core \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/android_arm64 --target idr_core
          cp build/android_arm64/libidr_core.a mobile/android/app/src/main/jniLibs/arm64-v8a/ || true

      - name: Build Flutter Android APK
        run: |
          cd mobile
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter build apk --release --split-per-abi || flutter build apk --release
            mkdir -p ../web/public/downloads/
            cp build/app/outputs/flutter-apk/*.apk ../web/public/downloads/ || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: idr-navigation-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            web/public/downloads/*.apk
          retention-days: 30
