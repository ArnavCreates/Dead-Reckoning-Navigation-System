name: Build Android APK Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'mobile/**'
      - 'core/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK (ARM64 / ARMv7)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Android project files
        run: |
          set -euo pipefail
          cd mobile
          test -f pubspec.yaml
          if [ ! -f "android/settings.gradle" ]; then
            flutter create --org com.idr --platforms=android .
          fi

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libeigen3-dev

      - name: Build JNI Core for Android ABIs (C++ / NDK)
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            build_dir="build/android_${abi}"
            cmake -S mobile/android/app/src/main/cpp -B "$build_dir" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "$build_dir" --target idr_core_jni
            mkdir -p "mobile/android/app/src/main/jniLibs/$abi"
            lib_path="$(find "$build_dir" -type f -name libidr_core_jni.so -print -quit)"
            test -s "$lib_path"
            cp "$lib_path" "mobile/android/app/src/main/jniLibs/$abi/"
          done

      - name: Build Flutter Android APK
        run: |
          set -euo pipefail
          cd mobile
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          apk_dir="build/app/outputs/flutter-apk"
          test -s "$apk_dir/app-arm64-v8a-release.apk"
          test -s "$apk_dir/app-armeabi-v7a-release.apk"

      - name: Verify APKs contain the native core for each ABI
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            apk="mobile/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$apk"
            jar tf "$apk" | grep -Fx "lib/$abi/libidr_core_jni.so"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: idr-navigation-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
